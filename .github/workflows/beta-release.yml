name: Pre-Release (Installer + Standalone)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - '*alpha*'
      - '*Alpha*'
      - '*beta*'
      - '*Beta*'
      - '*rc*'
      - '*RC*'
      - '*dev*'
      - '*Dev*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Pre-Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_path: build/windows/x64/runner/Release
          - os: ubuntu-22.04
            platform: linux
            asset_name: Front_Porch_AI_Linux.tar.gz
            build_path: build/linux/x64/release/bundle

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev libwebkit2gtk-4.1-dev ninja-build pkg-config cmake libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Sync Version from Tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(echo "$TAG" | sed 's/^[vV]//')
          # Convert 4-part (0.0.4.1) to Flutter format (0.0.4+1)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            FLUTTER_VERSION="$(echo $VERSION | sed 's/\.\([^.]*\)$/+\1/')"
          else
            FLUTTER_VERSION="${VERSION}+0"
          fi
          echo "Setting version to: $FLUTTER_VERSION"
          # Use the full version (including 4th part if present) for the Dart display constant
          DISPLAY_VERSION="$VERSION"
          # Route A (2026-10-28): pubspec.yaml carries no version. Persist the
          # build name/number for the later `flutter build` steps instead.
          echo "FLUTTER_BUILD_NAME=${FLUTTER_VERSION%%+*}" >> "$GITHUB_ENV"
          echo "FLUTTER_BUILD_NUMBER=${FLUTTER_VERSION##*+}" >> "$GITHUB_ENV"
          # Use Python for cross-platform reliability (sed can fail silently with Windows \r\n line endings)
          python3 -c "
          import re
          # Patch only the appVersion constant (preserve all committed getters and comments).
          # This eliminates duplication and prevents compile breaks when app_version.dart evolves.
          # Route A: do NOT write a version to pubspec.yaml; appVersion is the single source of truth.
          with open('lib/app_version.dart', 'r') as f: content = f.read()
          content = re.sub(r\"^const String appVersion = '.*';\$\", "const String appVersion = '$DISPLAY_VERSION';", content, flags=re.MULTILINE)
          with open('lib/app_version.dart', 'w') as f: f.write(content)
          "
          # Verify the version constant was updated (visible in CI logs).
          # Route A: there is no pubspec version to verify.
          echo "Verifying Dart version constant:"
          cat lib/app_version.dart
          echo "Build name/number for flutter build:"
          echo "FLUTTER_BUILD_NAME=${FLUTTER_VERSION%%+*} FLUTTER_BUILD_NUMBER=${FLUTTER_VERSION##*+}"

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Node (for the WebUI bundle)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web_ui/package-lock.json

      # Regenerate assets/web_app from web_ui/src so the Flutter build bundles a
      # fresh WebUI (never a stale committed bundle). Must run before flutter build.
      - name: Build WebUI bundle
          # --ignore-scripts: no package in this tree runs an install-time
          # script today (verified 2026-08-05), so this changes nothing now
          # and blocks the ChainDrop vector if one ever arrives.
        run: npm ci --ignore-scripts && npm run build
        working-directory: web_ui

      - name: Build Application
        if: matrix.platform != 'linux'
        run: flutter build ${{ matrix.platform }} --release --build-name=${{ env.FLUTTER_BUILD_NAME }} --build-number=${{ env.FLUTTER_BUILD_NUMBER }}

      - name: Build Application (Linux)
        if: matrix.platform == 'linux'
        env:
          CXXFLAGS: "-Wno-unknown-warning-option"
        run: flutter build linux --release --build-name=${{ env.FLUTTER_BUILD_NAME }} --build-number=${{ env.FLUTTER_BUILD_NUMBER }}

      # ── Guard: the Linux bundle MUST be able to reach SQLite ──
      # v1.1.0 shipped with no SQLite in the bundle and bricked every Linux
      # install ("libsqlite3.so is missing" -> "database is corrupted"). The
      # build succeeded and tests passed; only real users saw it. Checks
      # REACHABILITY, not a filename: sqlite3 3.x emits a standalone
      # lib/libsqlite3.so, sqlite3_flutter_libs 0.5.x compiles sqlite3.c into
      # the plugin .so. Either is fine; zero exporters is a broken release.
      # Full rationale in .github/workflows/release.yml and pubspec.yaml.
      - name: Verify SQLite is bundled (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          BUNDLE=build/linux/x64/release/bundle
          FOUND=""
          while IFS= read -r so; do
            if nm -D --defined-only "$so" 2>/dev/null | grep -qE ' sqlite3_open_v2$'; then
              echo "  ✓ $(basename "$so") exports sqlite3_open_v2"
              FOUND="yes"
            fi
          done < <(find "$BUNDLE" -name '*.so*' -type f)
          if [ -z "$FOUND" ]; then
            echo "::error::No library in the Linux bundle exports the SQLite C API."
            echo "::error::The app cannot open its database. See pubspec.yaml note."
            find "$BUNDLE" -name '*.so*' -type f -printf '  %f\n' || true
            exit 1
          fi
          echo "SQLite is reachable from the bundle."

      - name: Download VC++ Redistributable
        if: matrix.platform == 'windows'
        run: |
          $DestDir = "${{ github.workspace }}\${{ matrix.build_path }}\.."
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "$DestDir\vc_redist.x64.exe"
          Write-Host "VC++ Redistributable downloaded to $DestDir"
        shell: pwsh

      - name: Build Windows Installer (Inno Setup)
        if: matrix.platform == 'windows'
        run: |
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '^[vV]', ''
          choco install innosetup -y --no-progress
          $ISCC = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $ISCC /DPRE_RELEASE=1 /DMyAppVersion="$VERSION" /DMyAppBuildDir="${{ github.workspace }}\${{ matrix.build_path }}" /DMyAppLicenseFile="${{ github.workspace }}\LICENSE" /DMyAppIconFile="${{ github.workspace }}\windows\runner\resources\app_icon.ico" "installers\windows\setup.iss"
          Copy-Item "installers\windows\Front_Porch_AI_Beta_Setup.exe" -Destination "."
        shell: pwsh

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(echo ${GITHUB_REF_NAME} | sed 's/^[vV]//')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package Linux (AppImage + tar.gz only)
        if: matrix.platform == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Building beta packages for version $VERSION"
          
          # 1. Prepare AppImage
          mkdir -p AppDir/usr/bin
          cp -r ${{ matrix.build_path }}/* AppDir/usr/bin/
          
          # Create Desktop file
          cat <<EOF > AppDir/front_porch_ai.desktop
          [Desktop Entry]
          Name=Front Porch AI
          Exec=front_porch_ai
          Icon=front_porch_ai
          Type=Application
          Categories=Utility;
          Comment=A chilled out frontend for KoboldCPP
          EOF
          
          # Icon management
          if [ -f "assets/images/front_porch_ai_icon.png" ]; then
            cp assets/images/front_porch_ai_icon.png AppDir/front_porch_ai.png
            cp assets/images/front_porch_ai_icon.png AppDir/.DirIcon
          else
            touch AppDir/front_porch_ai.png
            touch AppDir/.DirIcon
          fi
          
          # AppRun - symlink to the binary in usr/bin
          ln -s usr/bin/front_porch_ai AppDir/AppRun
          
          # AppImageKit `continuous` now 404s as HTML. Pin maintained appimagetool.
          curl -fL https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o appimagetool
          if ! file appimagetool | grep -qi ELF; then
            echo "appimagetool download is not an ELF binary:" >&2
            file appimagetool
            ls -l appimagetool
            exit 1
          fi
          chmod +x appimagetool
          ./appimagetool AppDir Front_Porch_AI-Linux.AppImage
          
          # 2. Standard tar.gz (no deb, no rpm)
          cd ${{ matrix.build_path }}
          tar -czvf ../../../../../${{ matrix.asset_name }} .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: |
            Front_Porch_AI_Beta_Setup.exe
            Front_Porch_AI-Linux.AppImage
          if-no-files-found: ignore

      - name: Prepare Friendly Release Notes
        id: release_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"

          # Try to find a matching per-branch notes file
          if [[ "$TAG" == *"Beta"* ]] || [[ "$TAG" == *"beta"* ]]; then
            NOTES_FILE="docs/0.9.8-Beta.md"
          elif [[ "$TAG" == *"Rawhide"* ]] || [[ "$TAG" == *"nightly"* ]]; then
            NOTES_FILE="docs/Rawhide.md"
          else
            NOTES_FILE="docs/main.md"
          fi

          if [ -f "$NOTES_FILE" ]; then
            BODY=$(awk '
              /^## / { if (in_content) { exit }; in_content=1; next }
              in_content { print }
            ' "$NOTES_FILE" || true)

            if [ -n "$BODY" ]; then
              echo "body<<EOF" >> $GITHUB_OUTPUT
              echo "$BODY" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "Using notes from $NOTES_FILE for tag $TAG"
            else
              echo "body=" >> $GITHUB_OUTPUT
            fi
          else
            echo "No notes file found at $NOTES_FILE — release body will be empty"
            echo "body=" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Front_Porch_AI_Beta_Setup.exe
            Front_Porch_AI-Linux.AppImage
          prerelease: true
          name: "${{ github.ref_name }} (Pre-Release)"
          body: ${{ steps.release_notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── AUR publishing removed 2026-08-03 (maintainer-directed) ─────────────
  # The AUR disabled package adoption on 2026-07-30 and froze ALL pushes on
  # 2026-08-01 (third malware wave since June — 'Atomic Arch' et al.; Robin
  # Candau's aur-general announcement gives no restoration ETA, only "we will
  # send a follow-up once we're able to"). Our job could not even clone over
  # SSH, so every run ended in a red X and a failure email. The complete job
  # text lives in git history — `git log -S publish-aur-beta` finds it — and the
  # AUR_SSH_KEY secret is intentionally left in place for reinstatement.
  # Until then front-porch-ai-beta-bin on the AUR goes stale; Arch users can install from the
  # GitHub release artifacts.
