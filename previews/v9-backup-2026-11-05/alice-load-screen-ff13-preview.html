<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice — Load screen preview (FF13 cutscene edgy)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#05070d;color:#fff;font-family:Georgia,Palatino,Times,serif;display:flex;align-items:center;justify-content:center}
  .screen{width:min(960px,94vw);min-height:min(600px,92vh);position:relative;overflow:hidden;border-radius:6px;background:radial-gradient(ellipse at 50% 30%,#1b3a2a 0%,#0a1410 45%,#02040a 100%);box-shadow:0 24px 80px rgba(0,0,0,.8);border:1px solid #2a4a3a}
  /* cinematic light beams, FF13 cutscene style */
  .beam{position:absolute;top:-20%;height:140%;width:120px;background:linear-gradient(180deg,rgba(180,255,220,0),rgba(180,255,220,.35),rgba(180,255,220,0));transform:rotate(18deg);filter:blur(2px)}
  .beam.b1{left:18%}.beam.b2{left:48%;width:60px;opacity:.7}.beam.b3{left:72%;width:180px;opacity:.5}
  .flare{position:absolute;left:50%;top:28%;width:220px;height:220px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9) 0%,rgba(120,255,180,.45) 30%,rgba(120,255,180,0) 70%)}
  .ring{position:absolute;left:50%;top:38%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(180,255,220,.35);box-shadow:0 0 60px rgba(0,255,150,.25), inset 0 0 60px rgba(0,255,150,.15)}
  .ring2{position:absolute;left:50%;top:38%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .rabbit{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:110px;filter:drop-shadow(0 0 24px rgba(120,255,180,.9)) drop-shadow(0 12px 24px rgba(0,0,0,.7))}
  .copy{position:relative;text-align:center;padding:52px 28px 0}
  .copy .kicker{margin:0;color:#8dffc4;letter-spacing:.45em;font-size:14px;text-transform:uppercase}
  .copy h1{margin:10px 0 0;font-size:72px;letter-spacing:.08em;color:#fff;text-shadow:0 0 24px rgba(120,255,180,.7),0 4px 18px rgba(0,0,0,.8)}
  .copy .tag{margin-top:14px;color:#d9f0e3;font-size:20px;font-style:italic;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .copy .sub{margin:12px 0 0;color:#9ab8a8;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
  .bar-wrap{position:absolute;left:0;right:0;bottom:0;padding:24px 32px 20px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85) 45%)}
  .bar{height:6px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00914f,#8dffc4,#fff);box-shadow:0 0 16px #8dffc4;animation:fill 9s ease-in-out infinite}
  @keyframes fill{0%{width:4%}55%{width:68%}85%{width:92%}100%{width:100%}}
  .status{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#d9f0e3;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
  .foot{margin:10px 0 0;text-align:center;color:#7a9484;font-size:13px}
  .letterbox{position:absolute;left:0;right:0;height:42px;background:#000;z-index:2}
  .letterbox.top{top:0}.letterbox.bottom{bottom:0}
</style>
</head>
<body>
  <div class="screen">
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <div class="flare"></div><div class="ring"></div><div class="ring2"></div>
    <div class="rabbit">🐇</div>
    <div class="copy">
      <p class="kicker">Rabbit Hole presents</p>
      <h1>ALICE</h1>
      <p class="tag">Follow the White Rabbit</p>
      <p class="sub">Alice v1.0 &nbsp;•&nbsp; Install Version 1</p>
    </div>
    <div class="bar-wrap">
      <div class="bar"><i></i></div>
      <div class="status"><span id="tip">Loading your world…</span><span>Loading</span></div>
      <p class="foot">Local first. No rent, no cloud. Your hardware, your story.</p>
    </div>
  </div>
<script>
  const tips=["Loading your world…","Waking the models…","Setting the stage…","Polishing the looking glass…"];
  let i=0; setInterval(()=>{ i=(i+1)%tips.length; document.getElementById('tip').textContent=tips[i]; }, 3000);
</script>
</body>
</html>
